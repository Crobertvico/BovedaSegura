name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android del runner
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"; yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar llave de firma
        env:
          KS_B64: ${{ secrets.BS_KEYSTORE_B64 }}
          BS_KEYSTORE_PASSWORD: ${{ secrets.BS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t"')
            echo "Largo del secreto BS_KEYSTORE_B64 sin espacios: ${#CLEAN} (esperado: 5728)"
            printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::BS_KEYSTORE_B64 no es base64 válido (¿se copió incompleto?)"; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$BS_KEYSTORE_PASSWORD" > /dev/null || { echo "::error::La llave no abre con BS_KEYSTORE_PASSWORD"; exit 1; }
            echo "BS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BS_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto BS_KEYSTORE_B64: el APK se firmará con llave de depuración."
          fi

      - name: Compilar release
        env:
          BS_KEYSTORE_PASSWORD: ${{ secrets.BS_KEYSTORE_PASSWORD }}
          BS_KEY_ALIAS: ${{ secrets.BS_KEY_ALIAS }}
          BS_KEY_PASSWORD: ${{ secrets.BS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/BovedaSegura-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BovedaSegura-APK
          path: out/*.apk

      - name: Publicar versión (solo si está firmada con la llave fija)
        if: env.BS_SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk --title "Bóveda Segura $TAG" --notes "APK firmado. Instálalo encima de la versión anterior: tus datos se conservan."
